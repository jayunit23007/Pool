<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b25">
  <title>Pool Night — James vs Dan</title>
  <style>
    :root {
      color-scheme: dark;
      --felt: #102b25;
      --felt-light: #173a31;
      --panel: #1b302a;
      --panel-raised: #223b33;
      --cream: #f5f0df;
      --muted: #abb9a9;
      --lime: #d3ef85;
      --gold: #f0c77b;
      --line: rgba(245, 240, 223, .12);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% -20%, rgba(71, 117, 81, .32), transparent 55%),
        var(--felt);
    }

    button { font: inherit; }

    .page {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
      padding: 48px 0 38px;
    }

    header { text-align: center; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      color: var(--lime);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before, .eyebrow::after {
      width: 22px;
      height: 1px;
      background: currentColor;
      content: "";
      opacity: .65;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 7vw, 4.4rem);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1;
    }

    .subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: .98rem;
    }

    .match-card {
      position: relative;
      overflow: hidden;
      margin-top: 37px;
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(140deg, rgba(38, 67, 55, .97), rgba(24, 46, 39, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .2);
    }

    .match-card::before {
      position: absolute;
      top: -110px;
      left: 50%;
      width: 360px;
      height: 220px;
      border: 1px solid rgba(211, 239, 133, .08);
      border-radius: 50%;
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .scoreboards {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .player {
      padding: 25px 22px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(9, 29, 24, .38);
      text-align: center;
    }

    .player.celebrate-win { animation: win-bounce .55s ease-out; }
    .player.celebrate-prize {
      animation: prize-glow 1.15s ease-out;
      border-color: var(--lime);
    }

    .player.dan.celebrate-prize { border-color: var(--gold); }

    @keyframes win-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-8px) scale(1.025); }
      70% { transform: translateY(2px) scale(.99); }
    }

    @keyframes prize-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(211, 239, 133, 0); }
      35% { transform: scale(1.045); box-shadow: 0 0 36px rgba(211, 239, 133, .48); }
      65% { transform: scale(.99); box-shadow: 0 0 18px rgba(211, 239, 133, .24); }
    }

    .player.dan.celebrate-prize { animation-name: dan-prize-glow; }

    @keyframes dan-prize-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(240, 199, 123, 0); }
      35% { transform: scale(1.045); box-shadow: 0 0 36px rgba(240, 199, 123, .5); }
      65% { transform: scale(.99); box-shadow: 0 0 18px rgba(240, 199, 123, .25); }
    }

    .celebration {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 10;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 12px 20px;
      border: 1px solid rgba(211, 239, 133, .4);
      border-radius: 999px;
      color: #17241a;
      background: var(--lime);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
      font-size: .95rem;
      font-weight: 800;
      text-align: center;
      transform: translate(-50%, -150%);
      pointer-events: none;
    }

    .celebration.visible { animation: toast-in-out 2s ease both; }
    .celebration.prize-toast {
      padding: 17px 26px;
      border-color: #ffe2a6;
      background: linear-gradient(135deg, #ffe2a6, var(--gold));
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 4vw, 1.4rem);
    }

    @keyframes toast-in-out {
      0% { opacity: 0; transform: translate(-50%, -150%) scale(.8); }
      14%, 78% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -20%) scale(.96); }
    }

    .confetti {
      position: fixed;
      inset: 0;
      z-index: 9;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -18px;
      left: var(--x);
      width: var(--size);
      height: calc(var(--size) * 1.6);
      border-radius: 2px;
      background: var(--color);
      animation: confetti-fall var(--duration) cubic-bezier(.15, .55, .4, 1) var(--delay) both;
    }

    @keyframes confetti-fall {
      to { transform: translate3d(var(--drift), 110vh, 0) rotate(760deg); opacity: .8; }
    }

    .player-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
    }

    .player-avatar {
      position: relative;
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      overflow: hidden;
      border: 2px solid rgba(245, 240, 223, .65);
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .28);
    }

    .player-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
    }

    .wink-lid {
      position: absolute;
      top: 37%;
      left: 39%;
      width: 18%;
      height: 7%;
      border-bottom: 2px solid #49372e;
      border-radius: 50%;
      background: #d78a4e;
      opacity: 0;
      transform: scaleY(0);
      transform-origin: center;
      pointer-events: none;
    }

    .player.dan .wink-lid { background: #db9a70; }

    .player.dan .wink-lid {
      top: 29%;
      left: 56%;
      width: 23%;
      height: 9%;
    }

    .player-avatar.winking .wink-lid {
      animation: player-wink .48s ease-in-out;
    }

    @keyframes player-wink {
      0%, 100% { opacity: 0; transform: scaleY(0); }
      30%, 72% { opacity: 1; transform: scaleY(1); }
    }

    .player-name {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .score {
      display: block;
      margin: 8px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4.5rem, 12vw, 6.3rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(245, 240, 223, .12);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--lime);
      transition: width .3s ease;
    }

    .player.dan .progress-fill { background: var(--gold); }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin: 8px 0 17px;
      color: var(--muted);
      font-size: .72rem;
    }

    .win-button {
      width: 100%;
      min-height: 45px;
      border: 0;
      border-radius: 10px;
      color: #17241a;
      background: var(--lime);
      cursor: pointer;
      font-size: .9rem;
      font-weight: 750;
      transition: filter .15s ease, transform .15s ease;
    }

    .dan .win-button { background: var(--gold); }
    .win-button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .win-button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .match-actions {
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .reset-button {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      transition: color .15s ease, border-color .15s ease;
    }

    .reset-button:hover { color: var(--cream); border-color: rgba(245, 240, 223, .35); }

    .milestones { margin-top: 35px; }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 15px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: 500;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
    }

    .milestone-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .milestone {
      min-height: 143px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(27, 48, 42, .78);
      transition: border-color .2s ease, background .2s ease;
    }

    .milestone.complete {
      border-color: rgba(211, 239, 133, .38);
      background: linear-gradient(145deg, rgba(47, 70, 49, .85), rgba(27, 48, 42, .88));
    }

    .milestone-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 17px;
    }

    .target {
      color: var(--lime);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .status {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--muted);
      font-size: .65rem;
      font-weight: 650;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .complete .status {
      border-color: rgba(211, 239, 133, .25);
      color: var(--lime);
    }

    .prize {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.22rem;
    }

    .buyer {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .complete .buyer { color: var(--cream); }

    .storage-note {
      min-height: 1.25em;
      margin: 17px 0 0;
      color: var(--muted);
      font-size: .74rem;
      text-align: center;
    }

    .storage-note.error { color: #ffb8a8; }

    .history { margin-top: 35px; }

    .history-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .history-column {
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(27, 48, 42, .78);
    }

    .history-column h3 {
      position: sticky;
      top: 0;
      z-index: 1;
      margin: 0;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-raised);
      color: var(--cream);
      font-size: .8rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .history-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-entry {
      padding: 13px 17px;
      border-bottom: 1px solid var(--line);
    }

    .history-entry:last-child { border-bottom: 0; }

    .history-win { display: block; margin-bottom: 4px; font-weight: 700; }
    .history-time { color: var(--muted); font-size: .78rem; }

    .empty-history {
      margin: 0;
      padding: 19px;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 28px, 460px); padding-top: 35px; }
      .match-card { margin-top: 28px; padding: 17px; border-radius: 17px; }
      .scoreboards { gap: 10px; }
      .player { padding: 20px 12px 14px; }
      .win-button { min-height: 42px; font-size: .82rem; }
      .milestone-list { grid-template-columns: 1fr; gap: 9px; }
      .milestone { min-height: auto; padding: 15px 17px; }
      .milestone-top { margin-bottom: 10px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .player.celebrate-win, .player.celebrate-prize, .celebration.visible, .confetti-piece,
      .player-avatar.winking .wink-lid { animation: none; }
      .player.celebrate-prize { box-shadow: 0 0 0 3px var(--lime); }
      .player.dan.celebrate-prize { box-shadow: 0 0 0 3px var(--gold); }
      .celebration.visible { transform: translate(-50%, 0); }
      .confetti { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">The pool table scoreboard</p>
      <h1>Pool Night</h1>
      <p class="subtitle">James vs Dan · Every game gets you closer to a treat.</p>
    </header>

    <section class="match-card" aria-label="Match score">
      <div class="scoreboards">
        <article class="player james">
          <div class="player-heading">
            <span class="player-avatar" aria-hidden="true">
              <img src="images/james-icon.png" alt="">
              <span class="wink-lid"></span>
            </span>
            <h2 class="player-name">James</h2>
          </div>
          <output class="score" id="james-score" aria-label="James wins">0</output>
          <div class="progress-track" role="progressbar" id="james-progress" aria-label="James progress to 40 wins" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
            <div class="progress-fill" id="james-fill"></div>
          </div>
          <div class="progress-label"><span>Wins</span><span>First to 40</span></div>
          <button class="win-button" id="james-win" type="button">+ James wins</button>
        </article>
        <article class="player dan">
          <div class="player-heading">
            <h2 class="player-name">Dan</h2>
            <span class="player-avatar" aria-hidden="true">
              <img src="images/dan-icon.png" alt="">
              <span class="wink-lid"></span>
            </span>
          </div>
          <output class="score" id="dan-score" aria-label="Dan wins">0</output>
          <div class="progress-track" role="progressbar" id="dan-progress" aria-label="Dan progress to 40 wins" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
            <div class="progress-fill" id="dan-fill"></div>
          </div>
          <div class="progress-label"><span>Wins</span><span>First to 40</span></div>
          <button class="win-button" id="dan-win" type="button">+ Dan wins</button>
        </article>
      </div>
      <div class="match-actions">
        <button class="reset-button" id="reset" type="button">Reset scores</button>
      </div>
    </section>
    <div class="celebration" id="celebration" role="status" aria-live="polite"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <section class="milestones" aria-labelledby="milestones-heading">
      <div class="section-heading">
        <h2 id="milestones-heading">The stakes</h2>
        <p class="section-note">First to each score buys the treat.</p>
      </div>
      <div class="milestone-list" id="milestone-list" aria-live="polite"></div>
    </section>
    <section class="history" aria-labelledby="history-heading">
      <div class="section-heading">
        <h2 id="history-heading">Win history</h2>
        <p class="section-note" id="history-count">0 recorded wins</p>
      </div>
      <div class="history-columns">
        <section class="history-column" aria-labelledby="james-history-heading">
          <h3 id="james-history-heading">James</h3>
          <ol class="history-list" id="james-history" aria-live="polite"></ol>
        </section>
        <section class="history-column" aria-labelledby="dan-history-heading">
          <h3 id="dan-history-heading">Dan</h3>
          <ol class="history-list" id="dan-history" aria-live="polite"></ol>
        </section>
      </div>
    </section>
    <p class="storage-note" id="storage-note" role="status">Scores save automatically on this device.</p>
  </main>

  <script>
    const STORAGE_KEY = "pool-night-scoreboard-v1";
    const players = ["james", "dan"];
    const milestones = [
      { score: 5, prize: "Vending drink" },
      { score: 20, prize: "Coffee" },
      { score: 40, prize: "Lunch" }
    ];
    const celebrationColors = ["#d3ef85", "#f0c77b", "#f5f0df", "#83c7a2", "#e7a5a0"];

    let state = { scores: { james: 0, dan: 0 }, winners: {}, history: [] };
    const storageNote = document.getElementById("storage-note");
    const celebration = document.getElementById("celebration");
    const confetti = document.getElementById("confetti");
    let celebrationTimer;
    let confettiTimer;
    const winkTimers = {};

    function showStorageError(message) {
      storageNote.textContent = message;
      storageNote.classList.add("error");
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        storageNote.textContent = "Scores save automatically on this device.";
        storageNote.classList.remove("error");
      } catch (error) {
        showStorageError("Could not save scores on this device. Your current scores remain visible until you leave this page.");
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        const validScores = parsed && parsed.scores &&
          players.every((player) => Number.isSafeInteger(parsed.scores[player]) && parsed.scores[player] >= 0);
        const validWinners = parsed && parsed.winners &&
          milestones.every(({ score }) => parsed.winners[score] === undefined || players.includes(parsed.winners[score]));
        const validHistory = parsed && (parsed.history === undefined ||
          (Array.isArray(parsed.history) && parsed.history.every((entry) =>
            entry && players.includes(entry.player) && typeof entry.timestamp === "string" &&
            !Number.isNaN(Date.parse(entry.timestamp)))));
        if (!validScores || !validWinners || !validHistory) {
          showStorageError("Saved scores were invalid and could not be loaded. Reset to start a new match.");
          return;
        }
        const history = parsed.history || [];
        const winners = {};
        for (const entry of history) {
          for (const { score } of milestones) {
            if (!winners[score] && entry.win === score) winners[score] = entry.player;
          }
        }
        if (!winners[5] && players.includes(parsed.winners[5])) {
          winners[5] = parsed.winners[5];
        }
        state = { scores: parsed.scores, winners, history };
      } catch (error) {
        showStorageError("Saved scores could not be read. Reset to start a new match.");
      }
    }

    function render() {
      for (const player of players) {
        const score = state.scores[player];
        document.getElementById(`${player}-score`).textContent = score;
        document.getElementById(`${player}-fill`).style.width = `${Math.min(score / 40 * 100, 100)}%`;
        const progress = document.getElementById(`${player}-progress`);
        progress.setAttribute("aria-valuenow", Math.min(score, 40));
      }

      const list = document.getElementById("milestone-list");
      list.replaceChildren();
      for (const milestone of milestones) {
        const winner = state.winners[milestone.score];
        const card = document.createElement("article");
        card.className = `milestone${winner ? " complete" : ""}`;
        card.innerHTML = `
          <div class="milestone-top">
            <span class="target">First to ${milestone.score}</span>
            <span class="status">${winner ? "Reached" : "In play"}</span>
          </div>
          <p class="prize">${milestone.prize}</p>
          <p class="buyer">${winner ? `${winner[0].toUpperCase()}${winner.slice(1)} buys` : "Waiting for a winner"}</p>`;
        list.append(card);
      }

      const historyLists = Object.fromEntries(players.map((player) => {
        const historyList = document.getElementById(`${player}-history`);
        historyList.replaceChildren();
        return [player, historyList];
      }));
      document.getElementById("history-count").textContent =
        `${state.history.length} recorded ${state.history.length === 1 ? "win" : "wins"}`;

      const formatter = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "medium"
      });
      for (const entry of [...state.history].reverse()) {
        const item = document.createElement("li");
        item.className = "history-entry";
        const win = document.createElement("span");
        win.className = "history-win";
        win.textContent = `Win #${entry.win}`;
        const time = document.createElement("time");
        time.className = "history-time";
        time.dateTime = entry.timestamp;
        time.textContent = formatter.format(new Date(entry.timestamp));
        item.append(win, time);
        historyLists[entry.player].append(item);
      }

      for (const player of players) {
        if (historyLists[player].childElementCount === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-history";
          empty.textContent = "No wins recorded yet.";
          historyLists[player].append(empty);
        }
      }
    }

    function celebrateWin(player, prize) {
      const card = document.querySelector(`.player.${player}`);
      const avatar = card.querySelector(".player-avatar");
      const name = player[0].toUpperCase() + player.slice(1);
      card.classList.remove("celebrate-win", "celebrate-prize");
      void card.offsetWidth;
      card.classList.add(prize ? "celebrate-prize" : "celebrate-win");
      avatar.classList.remove("winking");
      void avatar.offsetWidth;
      avatar.classList.add("winking");
      window.clearTimeout(winkTimers[player]);
      winkTimers[player] = window.setTimeout(() => avatar.classList.remove("winking"), 550);

      celebration.classList.remove("visible", "prize-toast");
      celebration.textContent = prize ? `${name} wins the ${prize.toLowerCase()}!` : `${name} scores a win!`;
      if (prize) celebration.classList.add("prize-toast");
      void celebration.offsetWidth;
      celebration.classList.add("visible");
      window.clearTimeout(celebrationTimer);
      celebrationTimer = window.setTimeout(() => {
        celebration.classList.remove("visible", "prize-toast");
      }, 2100);

      confetti.replaceChildren();
      const pieceCount = prize ? 44 : 12;
      for (let index = 0; index < pieceCount; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.setProperty("--x", `${Math.random() * 100}%`);
        piece.style.setProperty("--size", `${prize ? 7 + Math.random() * 6 : 5 + Math.random() * 4}px`);
        piece.style.setProperty("--color", celebrationColors[Math.floor(Math.random() * celebrationColors.length)]);
        piece.style.setProperty("--duration", `${prize ? 1.6 + Math.random() * .9 : 1 + Math.random() * .5}s`);
        piece.style.setProperty("--delay", `${Math.random() * .18}s`);
        piece.style.setProperty("--drift", `${(Math.random() - .5) * 180}px`);
        confetti.append(piece);
      }
      window.clearTimeout(confettiTimer);
      confettiTimer = window.setTimeout(() => confetti.replaceChildren(), prize ? 3000 : 2200);
    }

    function addWin(player) {
      if (state.scores[player] === Number.MAX_SAFE_INTEGER) {
        showStorageError("The score limit has been reached. Reset the match to continue.");
        return;
      }
      state.scores[player] += 1;
      let prizeWon = "";
      state.history.push({
        player,
        win: state.scores[player],
        timestamp: new Date().toISOString()
      });
      for (const { score, prize } of milestones) {
        if (!state.winners[score] && state.scores[player] === score) {
          state.winners[score] = player;
          prizeWon = prize;
        }
      }
      render();
      saveState();
      celebrateWin(player, prizeWon);
    }

    for (const player of players) {
      document.getElementById(`${player}-win`).addEventListener("click", () => addWin(player));
    }

    document.getElementById("reset").addEventListener("click", () => {
      if (!window.confirm("Reset both scores and all prize milestones?")) return;
      state = { scores: { james: 0, dan: 0 }, winners: {}, history: [] };
      render();
      saveState();
    });

    loadState();
    render();
  </script>
</body>
</html>
